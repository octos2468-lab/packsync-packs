[general]
	#Frost arrows deal triple damage to Blazes and extinguish burning targets; they are never on fire.
	frostArrowsShouldBeCold = true
	#Old slowdown (a cobweb for one tick) instead of the Slowness effect.
	oldFrostArrowMobSlowdown = false
	#AlwaysCustomArrows: use 1, shoot the used arrow type; AlwaysStandardArrows: use 1, shoot standard arrows; UseAmountShot: use as many as shot.
	#Allowed Values: AlwaysCustomArrows, AlwaysStandardArrows, UseAmountShot
	customArrowMultiShot = "AlwaysCustomArrows"

	[bows.diamondbow]
		#How much durability the bow has.
		# Default: 1016
		# Range: > 1
		confBowDurability = 1016
		#The multiplier to the base damage of the bow. Higher is more damage.
		# Default: 1.25
		# Range: 0.0 ~ 1000.0
		confBowDamageMult = 1.0
		#How fast the bow's drawback is. Lower is faster.
		# Default: 6.0
		# Range: 0.1 ~ 1000.0
		confBowDrawbackDiv = 16.0

