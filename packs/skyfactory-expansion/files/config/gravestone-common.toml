[gravestone]
	#The names of the dimensions for the death note, as dimension_id=Name
	dimension_names = ["minecraft:the_nether=Nether", "minecraft:overworld=Overworld", "minecraft:the_end=The End"]
	#If this is set to true you get a death note after you died
	enable_death_note = false
	#If this is set to true every living entity will generate a gravestone
	enable_living_entity_graves = false
	#The date format outputted by clicking the gravestone or displayed in the death note
	grave_date_format = "yyyy/MM/dd HH:mm:ss"
	#If this is set to true only the player that owns the gravestone can break it (ops in creative mode can too, and the items then drop on the ground)
	only_owners_can_break = true
	#If this is set to true the death note will be taken out of your inventory when you destroyed the gravestone
	remove_death_note = false
	#If this is set to true the players head will be rendered on the gravestone when there is a full block under it
	render_skull = true
	#The blocks that can be replaced with a grave when someone dies on it (ids, or #tags)
	replaceable_blocks = ["minecraft:short_grass", "minecraft:tall_grass", "minecraft:fern", "minecraft:large_fern", "minecraft:water", "minecraft:lava", "#minecraft:flowers", "#minecraft:saplings", "minecraft:brown_mushroom", "minecraft:red_mushroom", "minecraft:torch", "minecraft:wall_torch", "minecraft:snow", "minecraft:vine", "minecraft:dead_bush", "minecraft:sugar_cane", "minecraft:fire"]
	#If this is set to true a ghost of the dead player will be spawned when the gravestone is broken (not ported: the ghost entity is missing)
	spawn_ghost = false
